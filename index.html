<script>
(()=>{'use strict';
/* ---------- constants & helpers ---------- */
const NS='Not supplied by the live feed',DEF_ADDR='465 Caledonian Road, London N7 9GU',HOME_STOP='490000035A',SEG_SEC=70;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rad=Math.PI/180;
const hav=(a,b)=>{const R=6371000,dl=(b[1]-a[1])*rad,dn=(b[0]-a[0])*rad,x=Math.sin(dl/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const fmtT=ms=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(ms);
const fmtTS=ms=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(ms);
function lp(ms){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'long',hourCycle:'h23'}).formatToParts(ms);const g=t=>p.find(x=>x.type===t).value;return{h:+g('hour'),m:+g('minute'),s:+g('second'),wd:g('weekday')}}
const mins=s=>Math.round(s/60);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
/* ---------- settings (local only) ---------- */
const DEF={walkKmh:4.8,walkMinutes:1,buffer:2,units:'km',theme:'dark',motion:false,traffic:true,timing:true,saveAddress:true,address:DEF_ADDR,startCoords:null,stopId:HOME_STOP,proxy:'',weather:false,useLoc:false,notify:false,leaveNow:false,followVid:null,homeVersion:2};
let cfg={...DEF};try{Object.assign(cfg,JSON.parse(localStorage.getItem('b91')||'{}'))}catch{}
const persist=()=>{const c={...cfg};if(!c.saveAddress){c.startCoords=null;c.stopId=null}try{localStorage.setItem('b91',JSON.stringify(c))}catch{}};
// Previous versions could retain an incorrect geocoded pin; resolve this precise address afresh.
if(cfg.homeVersion!==2){cfg={...cfg,address:DEF_ADDR,stopId:HOME_STOP,startCoords:null,saveAddress:true,useLoc:false,walkMinutes:1,theme:'dark',timing:true,homeVersion:2};persist()}
const fmtD=m=>cfg.units==='mi'?(m<400?Math.round(m*1.0936)+' yd':(m/1609.34).toFixed(2)+' mi'):(m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km');
const fmtS=k=>cfg.units==='mi'?(k/1.609).toFixed(1)+' mph':k.toFixed(1)+' km/h';
/* ---------- state ---------- */
const S={gps:null,start:null,startLabel:'',stop:null,cands:[],nearby:[],arr:[],arrSource:null,arrMode:null,stopSource:null,backupReason:null,fetchedAt:0,err:null,rate:false,seq:null,walk:null,jp:null,lineStatus:null,roads:[],roadsAt:0,roadsErr:false,inc:[],sched:null,schedFor:null,veh:null,vehId:null,vehErr:null,vArr:null,btGpsAt:0,timingPoints:[],timingFor:null,timingAt:0,traffic:null,trafficErr:null,weather:null,weatherAt:0,demo:false,log:[],view:'overview',passed:null,loading:true,chosen:null,bp:null,notified:{},stopClosed:false,flags:new Set(),srcs:{},geoAlt:[]};
class ApiErr extends Error{constructor(k,m){super(m||k);this.kind=k}}
const logE=m=>{S.log.unshift(fmtTS(Date.now())+' '+String(m).replace(/-?\d+\.\d{3,}/g,'•').slice(0,180));S.log.length=Math.min(S.log.length,30)};
async function api(kind,path,params={},type='json'){
 const px=(cfg.proxy||'').trim().replace(/\/$/,'');
 const base=px?px+'/'+kind:(kind==='tfl'?'https://api.tfl.gov.uk':'https://bustimes.org');
 const u=new URL(base+path);for(const[k,v]of Object.entries(params))if(v!=null)u.searchParams.set(k,v);
 let r;try{r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout?AbortSignal.timeout(10000):undefined})}catch(e){logE(kind+' '+path+' network/CORS error');throw new ApiErr('net')}
 if(r.status===429){logE(kind+' '+path+' 429');if(kind==='tfl')S.rate=true;throw new ApiErr('rate')}
 if(!r.ok){logE(kind+' '+path+' HTTP '+r.status);throw new ApiErr('http',String(r.status))}
 try{return type==='text'?await r.text():await r.json()}catch{logE(kind+' '+path+' invalid response');throw new ApiErr('format')}
}

/* bustimes.org's API contains metadata; stop departures are a separate HTML
   fragment at /stops/{ATCO}/departures. Never mistake scheduled for live. */
const tflStopId=id=>String(id||'').trim().toUpperCase();
function londonCalendar(ms){
 const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(ms);
 const n=k=>+p.find(x=>x.type===k).value;
 return{y:n('year'),mo:n('month'),d:n('day'),h:n('hour'),mi:n('minute')};
}
const londonKey=p=>[p.y,String(p.mo).padStart(2,'0'),String(p.d).padStart(2,'0')].join('-');
function wallTimeMs(hm,day){
 const a=/^(\d{1,2}):(\d{2})$/.exec(hm||'');if(!a)return null;
 const utc=Date.UTC(day.y,day.mo-1,day.d,+a[1],+a[2]);
 // Test both GMT and BST: handles the October clock change without relying on device timezone.
 const options=[utc,utc-3600000].filter(t=>{const p=londonCalendar(t);return p.y===day.y&&p.mo===day.mo&&p.d===day.d&&p.h===+a[1]&&p.mi===+a[2]});
 return options.length?options:null;
}
function btClockMs(hm,now,dayHint){
 const base=londonCalendar(now),ans=[];
 for(let offset=0;offset<3;offset++){
  const d=new Date(Date.UTC(base.y,base.mo-1,base.d+offset));
  const day={y:d.getUTCFullYear(),mo:d.getUTCMonth()+1,d:d.getUTCDate()};
  if(dayHint&&londonKey(day)!==dayHint)continue;
  ans.push(...(wallTimeMs(hm,day)||[]));
 }
 return ans.filter(x=>x>=now-90000).sort((a,b)=>a-b)[0]??null;
}
function btDeparturesFromHTML(html,stopId,now=Date.now()){
 const dom=new DOMParser().parseFromString(html,'text/html');
 if(!dom.querySelector('#departures')){if(!dom.body.textContent.trim())return [];throw new ApiErr('format','No departures panel')}
 const out=[],tables=[...dom.querySelectorAll('#departures table')];
 for(const table of tables){
  const heads=[...table.querySelectorAll('thead th')].map(x=>x.textContent.replace(/\s/g,'').toLowerCase());
  const si=heads.findIndex(x=>x.includes('sched')),ei=heads.findIndex(x=>x.includes('expected'));
  for(const [i,tr] of [...table.querySelectorAll('tbody tr')].entries()){
   const td=[...tr.children].filter(x=>x.tagName==='TD');
   if(td.length<3||td[0].textContent.trim()!=='91')continue;
   const live=ei>=0?td[ei]?.textContent.trim():'',sched=si>=0?td[si]?.textContent.trim():'';
   const chosen=/^\d{1,2}:\d{2}$/.test(live)?live:/^\d{1,2}:\d{2}$/.test(sched)?sched:'';
   if(!chosen)continue;
   const time=btClockMs(chosen,now);if(time==null||time>now+3*3600000)continue;
   const link=td[1].querySelector('.vehicle a[href*="/vehicles/"]');
   const v=td[1].querySelector('.vehicle');
   const vtext=v?.textContent.trim()||'';
   const reg=vtext.match(/\b[A-Z]{2}\s?\d{2}\s?[A-Z]{3}\b/i)?.[0]?.replace(/\s/g,'').toUpperCase()||'';
   const dest=td[1].cloneNode(true);dest.querySelector('.vehicle')?.remove();
    out.push({vehicleId:reg,lineName:'91',naptanId:stopId,direction:'',towards:'',destinationName:dest.textContent.trim(),currentLocation:reg?'Vehicle on bustimes.org':null,
    expectedArrival:new Date(time).toISOString(),timestamp:new Date(now).toISOString(),timeToStation:Math.max(0,Math.round((time-now)/1000)),source:'bt',predictionKind:live&&chosen===live?'live':'scheduled',vehiclePage:link?.getAttribute('href')||null});
  }
 }
 // Missing Route 91 on a genuine departures panel is valid: no services shown.
 return out.sort((a,b)=>Date.parse(a.expectedArrival)-Date.parse(b.expectedArrival));
}
async function arrivalsForStop(stopId){
 try{
  const a=await api('tfl',`/StopPoint/${encodeURIComponent(stopId)}/Arrivals`);
  if(!Array.isArray(a))throw new ApiErr('format','TfL arrivals not an array');
  return{arr:a.filter(x=>x.lineName==='91'&&Number.isFinite(Date.parse(x.expectedArrival))).map(x=>({...x,source:'tfl',predictionKind:'live'})).sort((x,y)=>Date.parse(x.expectedArrival)-Date.parse(y.expectedArrival)),source:'tfl',reason:null};
 }catch(e){
  logE('TfL arrivals unavailable; trying bustimes.org');
  const html=await api('bt',`/stops/${encodeURIComponent(stopId)}/departures`,{},'text');
  return{arr:btDeparturesFromHTML(html,stopId),source:'bt',reason:e.kind||'err'};
 }
}
function btStopFromFeature(f){
 const p=f.properties||{},coords=f.geometry?.coordinates||[];
 const id=(p.url||'').match(/\/stops\/([^/?#]+)/)?.[1];
 if(!id||coords.length<2)return null;
 const ind=p.indicator||p.icon||'',letter=String(p.icon||ind.replace(/^Stop\s+/i,'')).trim().toUpperCase();
 return{id:tflStopId(id),name:p.name||'Bus stop',ind,letter,lat:+coords[1],lon:+coords[0],lines:Array.isArray(p.services)?p.services:String(p.services||'').split(/,\s*/),towards:'',dist:hav(S.start,coords),source:'bt'};
}
async function nearbyBtStops(){
 const [lon,lat]=S.start,dy=0.006,dx=0.010;
 const j=await api('bt','/stops.json',{xmin:lon-dx,ymin:lat-dy,xmax:lon+dx,ymax:lat+dy});
 if(!Array.isArray(j.features))throw new ApiErr('format','Stop search not GeoJSON');
 return j.features.map(btStopFromFeature).filter(x=>x&&x.dist<=650);
}

/* ---------- boot / data flow ---------- */
async function geocode(q){
 const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&countrycodes=gb&q='+encodeURIComponent(q),{referrerPolicy:'no-referrer'});
 if(!r.ok)throw new ApiErr('http');const j=await r.json();if(!j.length)throw new ApiErr('nf','Address not found');
 return j.map(x=>({lat:+x.lat,lon:+x.lon,label:x.display_name}));
}
async function resolveStart(){
 S.step='address lookup (OpenStreetMap geocoder)';S.flags.delete('location');
 if(cfg.useLoc){try{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:10000}));S.start=[p.coords.longitude,p.coords.latitude];S.startLabel='Your current location (device GPS, enabled by you)';S.srcs.start='Device location';return}catch{S.flags.add('location')}}
 if(cfg.saveAddress&&cfg.startCoords){S.start=cfg.startCoords;S.startLabel=cfg.address||'Saved address';S.srcs.start='Saved on this device';return}
 const g=await geocode(cfg.address||DEF_ADDR);S.geoAlt=g;S.start=[g[0].lon,g[0].lat];S.startLabel=cfg.address||DEF_ADDR;S.srcs.start='OpenStreetMap Nominatim geocoder';
 if(cfg.saveAddress){cfg.startCoords=S.start;persist()}
}
const norm=s=>{const tw=(s.additionalProperties||[]).find(p=>/towards/i.test(p.key));return{id:s.naptanId||s.id,name:s.commonName,ind:s.indicator||'',letter:(s.stopLetter||(s.indicator||'').replace(/^Stop\s+/i,'')).toUpperCase().trim(),lat:s.lat,lon:s.lon,dist:s.distance,lines:(s.lines||[]).map(l=>l.name||l.id),towards:tw?.value||''}};
async function resolveStop(){
 S.step='stop lookup (TfL then bustimes.org)';S.stop=null;S.stopSource=null;
 if(!cfg.useLoc&&cfg.saveAddress&&cfg.stopId){
  try{const s=norm(await api('tfl','/StopPoint/'+encodeURIComponent(cfg.stopId)));if(s.id){S.stopSource='tfl';await choose(s);return}}catch{}
  try{const j=await api('bt','/api/stops/',{atco_code:cfg.stopId});const x=(j.results||[]).find(x=>tflStopId(x.atco_code)===tflStopId(cfg.stopId));if(x&&x.location){const s={id:x.atco_code,name:x.name||x.common_name,lat:x.location[1],lon:x.location[0],letter:x.icon||x.indicator||'',lines:x.line_names||[],dist:hav(S.start,x.location)};S.stopSource='bt';await choose(s);return}}catch{}
 }
 try{
  const j=await api('tfl','/StopPoint',{lat:S.start[1],lon:S.start[0],'location.lat':S.start[1],'location.lon':S.start[0],stopTypes:'NaptanPublicBusCoachTram',radius:600,modes:'bus'});
  if(!Array.isArray(j.stopPoints))throw new ApiErr('format');
  S.nearby=j.stopPoints.map(norm);S.stopSource='tfl';
 }catch(e){
  logE('TfL stop lookup unavailable; trying bustimes.org nearby stops');
  S.nearby=await nearbyBtStops();S.stopSource='bt';
 }
 S.cands=S.nearby.filter(s=>s.lines.some(l=>String(l).toUpperCase()==='91')).sort((a,b)=>a.dist-b.dist);
 const A=S.cands.filter(s=>s.letter==='A');
 if(A.length===1){await choose(A[0])}else{go('pick')}
}

async function choose(s){
 S.stop=s;S.arr=[];S.arrSource=null;S.arrMode=null;S.backupReason=null;S.seq=null;S.sched=null;S.schedFor=null;S.fetchedAt=0;S.chosen=null;S.bp=null;S.vArr=null;S.veh=null;S.vehId=null;S.gps=null;S.btGpsAt=0;S.timingPoints=[];S.timingFor=null;S.timingAt=0;
 if(cfg.saveAddress){cfg.stopId=s.id;persist()}
 loadWalk();loadSched();loadStopBt();
 if(S.view==='pick')go('overview');
 await refresh();
}
async function loadStopBt(){S.stopBt=null;try{const j=await api('bt','/api/stops/',{atco_code:S.stop.id});S.stopBt=(j.results||[]).find(r=>r.atco_code===S.stop.id)||null}catch{S.stopBt=null}render()}
async function loadWalk(){
 const a=S.start,b=[S.stop.lon,S.stop.lat];
 try{const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a[0].toFixed(5)},${a[1].toFixed(5)};${b[0]},${b[1]}?overview=full&geometries=geojson`,{referrerPolicy:'no-referrer'});const j=await r.json();const rt=j.routes[0];S.walk={dist:rt.distance,geom:rt.geometry.coordinates,src:'FOSSGIS foot routing (OpenStreetMap data)',live:true}}
 catch{logE('walking route failed');S.walk={dist:hav(a,b)*1.25,geom:[a,b],src:'Straight-line distance × 1.25 (walking router unavailable)',live:false}}
 try{const j=await api('tfl',`/Journey/JourneyResults/${a[1].toFixed(5)},${a[0].toFixed(5)}/to/${S.stop.id}`,{mode:'walking',walkingSpeed:cfg.walkKmh<4?'slow':cfg.walkKmh>5.6?'fast':'average'});S.jp=j.journeys&&j.journeys[0]?{min:j.journeys[0].duration}:null}catch{S.jp=null}
 render();updateMap();
}
async function loadSched(){
 if(S.schedFor===S.stop.id)return;S.schedFor=S.stop.id;
 try{const j=await api('tfl',`/Line/91/Timetable/${S.stop.id}`);const wd=lp(Date.now()).wd;const dt=/sat/i.test(wd)?/sat/i:/sun/i.test(wd)?/sun/i:/mon|fri|week/i;const m=[];
  for(const rt of j.timetable?.routes||[])for(const sc of rt.schedules||[])if(dt.test(sc.name||''))for(const k of sc.knownJourneys||[])m.push(+k.hour*60+ +k.minute);
  S.sched=m.length?[...new Set(m)].sort((a,b)=>a-b):null}catch{S.sched=null}
}
async function ensureSeq(dir){
 if(S.seq&&S.seq.stopId===S.stop.id)return;
 for(const d of dir?[dir,dir==='inbound'?'outbound':'inbound']:['inbound','outbound']){
  try{const j=await api('tfl','/Line/91/Route/Sequence/'+d,{serviceTypes:'Regular'});let best=null;
   for(const sq of j.stopPointSequences||[]){const st=sq.stopPoint||[];if(st.some(x=>x.id===S.stop.id)&&(!best||st.length>best.length))best=st}
   if(!best)continue;
   const stops=best.map(x=>({id:x.id,name:x.name,lat:x.lat,lon:x.lon}));
   let lines=(j.lineStrings||[]).map(s=>{try{const p=JSON.parse(s);return Array.isArray(p[0][0])?p[0]:p}catch{return null}}).filter(Boolean);
   const sp=[S.stop.lon,S.stop.lat];let line=null,bd=1e9;
   for(const l of lines){let m=1e9;for(const v of l)m=Math.min(m,hav(v,sp));if(m<bd||(m===bd&&l.length>line.length)){bd=m;line=l}}
   S.seq={stopId:S.stop.id,dir:d,stops,line:line||stops.map(s=>[s.lon,s.lat])};return}catch(e){if(e.kind==='rate')throw e}
 }
}
// Vehicle records are keyed by registration; never use one bus's fleet details for another.
const vehicleKey=reg=>String(reg||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const vehicleRecords=new Map();
async function vehicleRecord(reg){
 const key=vehicleKey(reg);if(!key)return null;
 const cached=vehicleRecords.get(key);
 if(cached?.pending)return cached.pending;
 if(cached&&cached.until>Date.now()){if(cached.error)throw cached.error;return cached.value}
 const entry={};vehicleRecords.set(key,entry);
 entry.pending=(async()=>{
  try{
   const j=await api('bt','/api/vehicles/',{reg:String(reg).trim()});
   entry.value=(Array.isArray(j)?j:j.results||[]).find(v=>vehicleKey(v.reg)===key)||null;
   entry.until=Date.now()+(entry.value?15*60000:60000);return entry.value;
  }catch(error){entry.error=error;entry.until=Date.now()+60000;throw error}
  finally{entry.pending=null}
 })();return entry.pending;
}
async function loadVehicle(b){
 if(!b?.vehicleId)return;
 const vehicleId=String(b.vehicleId).trim();
 if(b.source==='tfl'){
  try{S.vArr=(await api('tfl','/Vehicle/'+encodeURIComponent(vehicleId)+'/Arrivals')).filter(x=>x.lineName==='91').sort((a,c)=>a.timeToStation-c.timeToStation)}catch{S.vArr=null}
 }else S.vArr=null;
 if(S.vehId!==vehicleId){S.vehId=vehicleId;S.veh=null;S.gps=null;S.vehErr=null;S.btGpsAt=0;S.timingFor=null;S.timingPoints=[];S.timingAt=0;
  try{const v=await vehicleRecord(vehicleId);S.veh=v||null;if(!v)S.vehErr='nf'}catch(e){S.vehErr=e.kind||'err'}
 }
 if(S.veh?.id&&S.vehId===vehicleId){
  await Promise.allSettled([loadBtGPS(S.veh,vehicleId),...(cfg.timing?[loadBtJourneyInfo(S.veh,false)]:[])]);
 }
}
/* bustimes.org's website tracks positions through /vehicles.json?id=ID,
   refreshed independently of trip/timetable details. Use only a recent, matched
   fix. The coordinate is a snapshot, not continuous GPS or a TfL prediction. */
function btVehiclePosition(item,requiredId){
 const v=item?.vehicle||{};
 if(String(v.id??item?.vehicle_id??'')!==String(requiredId))return null;
 const xy=item?.coordinates;
 const when=Date.parse(item?.datetime||item?.timestamp||'');
 const age=Date.now()-when;
 if(!Array.isArray(xy)||xy.length!==2||xy.some(x=>!Number.isFinite(x))||Math.abs(xy[0])>180||Math.abs(xy[1])>90||!Number.isFinite(when)||age< -30000||age>150000)return null;
 const line=String(item.service?.line_name||item.route_name||'').trim();
 // Never accidentally use the same vehicle's GPS while it is on a different route.
 if(line&&line!=='91')return null;
 if(!S.stop||hav(xy,[S.stop.lon,S.stop.lat])>17000)return null;
 return{pos:xy.slice(),dist:hav(xy,[S.stop.lon,S.stop.lat]),stopsAway:null,next:null,nextTts:null,estimated:false,gps:true,vehicleId:S.vehId,gpsReadAt:Date.now(),observedAt:when,age,journeyId:item.journey_id||null};
}
async function loadBtGPS(vehicle,vehicleId){
 try{
  const items=await api('bt','/vehicles.json',{id:vehicle.id});
  if(S.vehId!==vehicleId||!Array.isArray(items))return;
  S.gps=items.map(x=>btVehiclePosition(x,vehicle.id)).find(Boolean)||null;
 }catch(e){if(S.vehId===vehicleId){S.gps=null;logE('bustimes.org live GPS unavailable ('+(e.kind||'network')+')')}}
}
function valid91Gps(vehicleId){return S.gps?.vehicleId===vehicleId&&Date.now()-S.gps.observedAt<=150000?S.gps:null}

/* bustimes.org's public API serializer exposes trip.times[].timing_status:
   PTP = principal timing point, OTH = other stop. These are scheduled
   timing points, NOT proof that the bus is holding or will be on time. */
async function loadBtJourneyInfo(vehicle,includeGps){
 const vehicleId=S.vehId;
 if(S.timingFor===vehicleId&&Date.now()-S.timingAt<90000)return;
 S.timingAt=Date.now();S.timingFor=vehicleId;
 try{
  const j=await api('bt','/api/vehiclejourneys/',{vehicle:vehicle.id,date:londonKey(londonCalendar(Date.now()))});
  const now=Date.now(),journeys=(j.results||[]).filter(x=>String(x.route_name||'').trim()==='91'&&Number.isFinite(Date.parse(x.datetime))&&Date.parse(x.datetime)>now-6*3600000&&Date.parse(x.datetime)<now+45*60000).slice(0,3);
  for(const trip of journeys){
   const d=await api('bt',`/api/vehiclejourneys/${trip.id}/details/`);
   const times=d.trip?.times;
   if(!Array.isArray(times))continue;
   const points=times.filter(x=>x.timing_status==='PTP'&&Array.isArray(x.stop?.location)&&x.stop.location.length===2).map(x=>({id:x.stop.atco_code||'',name:x.stop.name||'Timing point',pos:x.stop.location,aimed:x.aimed_departure_time||x.aimed_arrival_time||null,expected:x.expected_departure_time||x.expected_arrival_time||null,actual:x.actual_departure_time||x.actual_arrival_time||null}));
   if(S.vehId!==vehicleId)return;
   S.timingPoints=points;S.timingFor=vehicleId;
   const live=(d.live||[]).find(x=>String(x.journey_id)===String(trip.id));
   const pos=live?.coordinates,ts=Date.parse(live?.datetime);
   if(includeGps&&Array.isArray(pos)&&pos.length===2&&pos.every(Number.isFinite)&&Number.isFinite(ts)&&Math.abs(now-ts)<120000){
    const dist=hav(pos,[S.stop.lon,S.stop.lat]);if(dist<15000)S.bp={pos,dist,stopsAway:null,next:null,nextTts:null,estimated:false,gps:true,vehicleId,gpsReadAt:Date.now(),age:now-ts};
   }
   if(points.length||live)break;
  }
 }catch{logE('bustimes.org timing points unavailable for this bus')}
}
function nextTimingPoint(){
 if(!S.timingPoints.length||!S.seq?.stops?.length)return null;
 const ids=S.seq.stops.map(x=>String(x.id).toUpperCase());
 const from=S.bp?.next?.id?ids.indexOf(String(S.bp.next.id).toUpperCase()): -1;
 if(from<0)return null; // Without a vehicle position, don't guess which timing point is next.
 const candidates=S.timingPoints.map(p=>({...p,index:ids.indexOf(String(p.id).toUpperCase())})).filter(p=>p.index>=from);
 return candidates.sort((a,b)=>a.index-b.index)[0]||null;
}
function timingRow(p){return `<div class="kv"><div class="k">${esc(p.name)}</div><div class="v">${p.aimed?esc(String(p.aimed).slice(11,16)||p.aimed):'Scheduled time unknown'}<br>${tag('sched','bustimes.org · principal timing point')}</div></div>`}

function dpt(d){try{if(d.geography?.type==='Point')return d.geography.coordinates;if(d.point){const a=typeof d.point==='string'?JSON.parse(d.point):d.point;const p=Array.isArray(a)?a:a?.coordinates;if(Array.isArray(p)&&Number.isFinite(+p[0])&&Number.isFinite(+p[1]))return p.map(Number)}const g=d.geometry?.coordinates;if(g){const f=x=>typeof x[0]==='number'?x:f(x[0]);return f(g)}}catch{}return null}
async function loadRoads(){
 if(!cfg.traffic){S.inc=[];S.roads=[];S.roadsErr=false;return}
 if(Date.now()-S.roadsAt>300000){
  S.roadsAt=Date.now();
  try{const d=await api('tfl','/Road/all/Disruption',{stripContent:'true'});if(!Array.isArray(d))throw new ApiErr('format');S.roads=d;S.roadsErr=false}
  catch{S.roadsErr=true;logE('TfL road incident feed unavailable')}
 }
 try{S.lineStatus=(await api('tfl','/Line/91/Status'))[0]?.lineStatuses||null}catch{S.lineStatus=null}
 try{const d=await api('tfl','/StopPoint/'+encodeURIComponent(S.stop.id)+'/Disruption');S.stopClosed=Array.isArray(d)&&d.some(x=>/clos/i.test((x.description||'')+(x.type||'')))}catch{S.stopClosed=false}
 computeInc();
}
function computeInc(){
 S.inc=[];if(!cfg.traffic||!S.stop)return;
 const st=S.seq?.stops||[],line=S.seq?.line||[],it=st.findIndex(s=>s.id===S.stop.id);
 const nextId=S.bp?.next?.id,idx=nextId?st.findIndex(s=>s.id===nextId):-1;
 const ahead=it>=0&&idx>=0&&idx<=it?st.slice(idx,it+1).map(s=>[s.lon,s.lat]):[];
 const stopPos=[S.stop.lon,S.stop.lat];
 for(const d of S.roads||[]){
  const p=dpt(d);if(!p||!Number.isFinite(p[0])||!Number.isFinite(p[1]))continue;
  const nearRoute=line.length>0?line.some(v=>hav(v,p)<280):hav(stopPos,p)<850;
  if(!nearRoute)continue;
  const isAhead=ahead.length>0&&ahead.some(a=>hav(a,p)<350),sev=(d.severity||'').toLowerCase();
  const closure=(d.streets||[]).some(s=>/clos/i.test(s.closure||''))||/clos/i.test(d.comments||'')||/clos/i.test(d.category||'');
  const add=!isAhead?0:closure?60:/serious|severe/.test(sev)?45:15;
  const eff=!ahead.length?'Near your stop or route; we cannot confirm if this is ahead of the bus.':!isAhead?'Not confirmed between the bus and your stop.':closure?'Road closure reported ahead. The prediction range is widened, not the estimated arrival time.':/serious|severe/.test(sev)?'Significant incident ahead; the prediction range is widened.':'Incident reported ahead; the prediction range is widened.';
  S.inc.push({id:d.id,cat:d.category||'Road incident',sub:d.subCategory||'',sev:d.severity||'Unknown',text:d.currentUpdate||d.comments||d.location||'',loc:d.location||'',pt:p,ahead:isAhead,closure,add,eff,status:d.status||''});
 }
 S.inc.sort((a,b)=>b.add-a.add);
}
async function loadTraffic(){
 S.traffic=null;if(!cfg.traffic){S.trafficErr='off';return}
 if(!(cfg.proxy||'').trim()){S.trafficErr='optional';return}
 // A real traffic journey must span upstream bus stops; walking 1 min from home is not useful.
 const st=S.seq?.stops||[],it=st.findIndex(x=>x.id===S.stop.id);
 if(it<1){S.trafficErr='noRoute';return}
 const origin=S.bp?.pos||[st[Math.max(0,it-5)].lon,st[Math.max(0,it-5)].lat];
 const dest=[S.stop.lon,S.stop.lat];
 if(hav(origin,dest)<350){S.trafficErr='shortRoute';return}
 try{
  const j=await api('traffic','/route',{from:origin[1].toFixed(5)+','+origin[0].toFixed(5),to:dest[1].toFixed(5)+','+dest[0].toFixed(5)});
  if(!Number.isFinite(+j.trafficDelaySec)||!Number.isFinite(+j.travelTimeSec))throw new ApiErr('format');
  S.traffic={delay:Math.max(0,+j.trafficDelaySec),travel:+j.travelTimeSec,src:j.provider||'Traffic provider via your proxy'};S.trafficErr=null;
 }catch{S.trafficErr='optional';logE('Optional traffic-speed provider not configured/available')}
}

async function loadWeather(){
 if(!cfg.weather||!S.start||Date.now()-S.weatherAt<900000)return;S.weatherAt=Date.now();
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${S.start[1].toFixed(2)}&longitude=${S.start[0].toFixed(2)}&current=temperature_2m,weather_code,precipitation`);const j=await r.json();S.weather=j.current}catch{S.weather=null}
}
const WX=c=>c===0?'Clear':c<4?'Cloudy':c<50?'Fog':c<60?'Drizzle':c<70?'Rain':c<80?'Snow':c<90?'Showers':'Thunderstorms';
let busy=false;
async function refresh(){
 if(!S.stop||busy)return;busy=true;S.rate=false;
 try{
  if(S.demo){demoArr()}else{
   try{
    const result=await arrivalsForStop(S.stop.id);
    S.arr=result.arr;S.arrSource=result.source;S.arrMode=result.arr.some(x=>x.predictionKind==='live')?'live':'scheduled';S.backupReason=result.reason;
    S.fetchedAt=Date.now();S.err=null;S.loading=false;
    if(result.source==='bt'){if(!S.bp?.gps||Date.now()-S.bp.gpsReadAt>90000)S.bp=null;S.vArr=null}
    render(); // Show arrivals immediately; optional vehicle/road lookups can finish later.
   }catch(e){S.err=e.kind||'err';S.backupReason='both';logE('TfL and bustimes.org arrivals unavailable')}
  }
  S.loading=false;
  const pre=pickBus(Date.now());
  if(S.lastVid&&S.arrSource==='tfl'&&!S.arr.find(x=>x.vehicleId===S.lastVid)&&S.lastTts<=150&&!S.demo){S.passed={vid:S.lastVid,at:Date.now()}}
  if(pre?.vehicleId){S.lastVid=pre.vehicleId;S.lastTts=(Date.parse(pre.expectedArrival)-Date.now())/1000}
  if(!pre?.vehicleId){S.veh=null;S.vehId=null;S.gps=null;S.vehErr=null}
  if(!S.demo&&pre){
   if(S.arrSource==='tfl'){
    await Promise.allSettled([ensureSeq(pre.direction),loadVehicle(pre)]);S.bp=valid91Gps(pre.vehicleId)||busPos(pre);
   }else{if(pre.vehicleId)await loadVehicle(pre);S.bp=valid91Gps(pre.vehicleId)||null}
  }else if(!S.demo&&!S.seq){try{await ensureSeq(null)}catch{}}
  if(!S.demo){await Promise.allSettled([loadRoads(),loadTraffic(),loadWeather()]);computeInc()}
 }finally{busy=false}
 render();updateMap();
}

function demoArr(){const n=Date.now();S.arr=[8,17,26].map((m,i)=>({vehicleId:'DEMO'+(i+1),lineName:'91',direction:'inbound',destinationName:'DEMO – not a real bus',expectedArrival:new Date(n+m*60000).toISOString(),timestamp:new Date(n).toISOString(),currentLocation:'Demonstration data',towards:'',naptanId:S.stop.id}));S.fetchedAt=n;S.err=null;S.arrSource='demo';S.arrMode='live'}
/* ---------- bus choice, position, prediction ---------- */
const walkSec=()=>Number.isFinite(+cfg.walkMinutes)&&+cfg.walkMinutes>0?+cfg.walkMinutes*60:(S.walk?S.walk.dist/(cfg.walkKmh/3.6):60);
const walkDesc=()=>+cfg.walkMinutes>0?`${cfg.walkMinutes} min (your estimate)`:`${mins(walkSec())} min (mapped route)`;
const catchableBuses=(now=Date.now())=>S.arr.filter(a=>Date.parse(a.expectedArrival)>=now+walkSec()*1000).sort((a,b)=>Date.parse(a.expectedArrival)-Date.parse(b.expectedArrival));
function pickBus(now){
 const ok=catchableBuses(now);
 const f=cfg.followVid&&ok.find(a=>a.vehicleId===cfg.followVid);return f||ok[0]||null;
}
function busPos(b){
 if(!S.seq||!S.vArr||!S.vArr.length)return null;
 const st=S.seq.stops,it=st.findIndex(s=>s.id===S.stop.id),nx=S.vArr[0],ix=st.findIndex(s=>s.id===nx.naptanId);
 if(it<0||ix<0||ix>it)return null;
 const n=st[ix],p=st[ix-1]||n,frac=p===n?0:clamp(nx.timeToStation/SEG_SEC,0,1);
 const seg=hav([p.lon,p.lat],[n.lon,n.lat]);let dist=seg*frac;for(let i=ix;i<it;i++)dist+=hav([st[i].lon,st[i].lat],[st[i+1].lon,st[i+1].lat]);
 return{pos:[n.lon+(p.lon-n.lon)*frac,n.lat+(p.lat-n.lat)*frac],dist,stopsAway:it-ix,next:n,nextTts:nx.timeToStation,estimated:true}
}
function schedFor(expMs){
 if(!S.sched)return null;const p=lp(expMs),cur=p.h*60+p.m+p.s/60;let best=null;
 for(const m of S.sched)if(best===null||Math.abs(m-cur)<Math.abs(best-cur))best=m;
 if(best===null||Math.abs(best-cur)>15)return null;return{ms:expMs-(cur-best)*60000,diffMin:cur-best};
}
function calc(){
 const now=Date.now(),b=pickBus(now);S.chosen=b;if(!b)return null;
 const exp0=Date.parse(b.expectedArrival),walk=walkSec(),buf=cfg.buffer*60;
 const feedTs=Date.parse(b.timestamp)||S.fetchedAt,age=Math.max(0,(now-feedTs)/1000);
 const sc=b.predictionKind==='scheduled'?null:schedFor(exp0),bp=S.bp,usingBt=b.source==='bt',timetableOnly=b.predictionKind==='scheduled';
 const tAdj=0; // No speculative road-traffic minutes added to a live TfL ETA.

   }

function b6Id(x){

}
function b6Reg(x){
 const v=x?.vehicle||{};

   const result=await api('bt','/api/services/',{slug:ROUTE6_SLUG});

   const service=matches.find(x=>x.slug===ROUTE6_SLUG&&String(x.line_name||'').trim()==='6');

  return api('bt','/api/vehicles/'+encodeURIComponent(numericId)+'/');

const MODEL_ROUTES={
 '91':{line:'91',city:'London',region:'L',slug:'91-crouch-end-hornsey-rise-nags-head-caledonian-ro'},
 '6':{line:'6',city:'Bristol',region:'SW',slug:ROUTE6_SLUG}

const MODELS={selected:'91',routes:{},vehicleCache:new Map()};

const modelTextKey=text=>String(text||'').normalize('NFKC').toLowerCase().replace(/[^a-z0-9]/g,'');

function modelRefKey(ref){return ref?.reg?'reg:'+vehicleKey(ref.reg):ref?.id!=null?'id:'+ref.id:ref?.slug?'slug:'+ref.slug:null}
function modelAddRef(state,ref,evidence){
 const key=modelRefKey(ref);if(!key)return;
 let entry=state.refs.get(key);
 if(!entry){entry={ref:{...ref},seen:false,upcoming:false,expected:false,predicted:false,vehicle:null};state.refs.set(key,entry)}
 else entry.ref={...entry.ref,...Object.fromEntries(Object.entries(ref).filter(([,v])=>v!=null&&v!==''))};

function modelCurrent(state,ticket){return MODELS.routes[state.line]===state&&state.date===modelToday()&&state.ticket===ticket}
function modelRebuild(state){
 const groups=new Map();let unknown=0;
 for(const item of state.refs.values()){
  const name=String(item.vehicle?.vehicle_type?.name||'').trim();
  if(!name){unknown++;continue}
  const key=modelTextKey(name);let group=groups.get(key);
  if(!group){group={name,seen:false,upcoming:false,expected:false,predicted:false,predictedAt:null,liveries:new Map()};groups.set(key,group)}
  for(const field of ['seen','upcoming','expected','predicted'])group[field]||=item[field];
  if(item.predictedAt)group.predictedAt=group.predictedAt?Math.min(group.predictedAt,item.predictedAt):item.predictedAt;
  if(state.line==='6'){
   const livery=b6LiveryData(item.vehicle),label=String(livery?.name||'').trim();
   const background=b6LiveryPreviewCSS(item.vehicle);
   const lkey=label?'name:'+modelTextKey(label):background?'pattern:'+background:'unknown';
   if(!group.liveries.has(lkey))group.liveries.set(lkey,{label:label||(background?'Unlabelled livery':'Livery not supplied'),vehicle:item.vehicle,seen:false,predicted:false});
   const variant=group.liveries.get(lkey);variant.seen||=item.seen;variant.predicted||=item.predicted;
  }

async function modelVehicle(ref){
 const key=ref.id!=null?'id:'+ref.id:modelRefKey(ref);if(!key)return null;
 const cached=MODELS.vehicleCache.get(key);
 if(cached?.pending)return cached.pending;
 if(cached&&cached.until>Date.now())return cached.value;
 const known=vehicleRecords.get(vehicleKey(ref.reg));
 if(known?.value&&known.until>Date.now()&&(ref.id==null||String(known.value.id)===String(ref.id)))return known.value;
 const entry={};MODELS.vehicleCache.set(key,entry);
 entry.pending=(async()=>{
  try{
   let vehicle;
   if(ref.id!=null&&/^\d+$/.test(String(ref.id)))vehicle=await api('bt','/api/vehicles/'+encodeURIComponent(ref.id)+'/');
   else if(ref.reg)vehicle=await vehicleRecord(ref.reg);
   else if(ref.slug){const data=await api('bt','/api/vehicles/',{slug:ref.slug});vehicle=(Array.isArray(data)?data:data.results||[]).find(v=>v.slug===ref.slug)||null}
   if(vehicle&&ref.id!=null&&String(vehicle.id)!==String(ref.id))throw new ApiErr('format','Vehicle record did not match');
   entry.value=vehicle||null;entry.until=Date.now()+(vehicle?15*60000:60000);

   return entry.value;

async function modelService(state){
 if(state.serviceId)return state.serviceId;
 const route=MODEL_ROUTES[state.line],data=await api('bt','/api/services/',{slug:route.slug});
 const service=(Array.isArray(data)?data:data.results||[]).find(v=>v.slug===route.slug&&String(v.line_name).trim()===route.line&&v.region_id===route.region);

async function modelHistory(state,ticket){
 const cursors=new Set();let cursor=null;
 state.historyComplete=false;
 for(let page=0;page<500;page++){
  if(!modelCurrent(state,ticket))return;
  const data=await api('bt','/api/vehiclejourneys/',{service:state.serviceId,date:state.date,...(cursor?{cursor}:{})});
  if(!Array.isArray(data?.results))throw new ApiErr('format','Journey history did not return a list');
  for(const journey of data.results){
   if(journey.date!==state.date||!journey.vehicle||(journey.route_name&&String(journey.route_name).trim()!==state.line))continue;
   const when=Date.parse(journey.datetime);
   if(Number.isFinite(when)&&londonKey(londonCalendar(when))!==state.date)continue;
   modelAddRef(state,journey.vehicle,{seen:!Number.isFinite(when)||when<=Date.now(),upcoming:Number.isFinite(when)&&when>Date.now()});
  }
  state.progress=`Reading today's journeys · ${state.refs.size} distinct vehicles found`;
  if(S.view==='models'&&MODELS.selected===state.line&&page%5===0)renderModels();
  if(!data.next){state.historyComplete=true;return}
  const next=new URL(data.next,'https://bustimes.org');
  if(next.origin!=='https://bustimes.org'||next.pathname!=='/api/vehiclejourneys/')throw new ApiErr('format','Unexpected journey pagination');
  cursor=next.searchParams.get('cursor');
  if(!cursor||cursors.has(cursor))throw new ApiErr('format','Journey history pagination repeated');

async function modelExpected(state){
 if(state.line==='91'){
  const data=await api('tfl','/Line/91/Arrivals');if(!Array.isArray(data))throw new ApiErr('format');
  for(const arrival of data){
   const time=Date.parse(arrival.expectedArrival),stamp=Date.parse(arrival.timestamp);
   if(String(arrival.lineId||arrival.lineName).toLowerCase()!=='91'||!arrival.vehicleId||!Number.isFinite(time)||time<Date.now()||time>Date.now()+2*3600000||londonKey(londonCalendar(time))!==state.date)continue;
   if(Number.isFinite(stamp)&&(Date.now()-stamp>5*60000||stamp>Date.now()+30000))continue;
   modelAddRef(state,{reg:arrival.vehicleId},{expected:true});
  }
 }else{
  const data=await api('bt','/vehicles.json',{service:state.serviceId});if(!Array.isArray(data))throw new ApiErr('format');
  for(const report of data){
   const time=b6When(report),line=String(report.service?.line_name||report.route_name||'').trim();
   if((line&&line!=='6')||!Number.isFinite(time)||time>Date.now()+30000||londonKey(londonCalendar(time))!==state.date)continue;
   const serviceUrl=String(report.service?.url||'');
   if(serviceUrl&&!serviceUrl.replace(/\/$/,'').endsWith('/'+MODEL_ROUTES['6'].slug))continue;
   const vehicle=report.vehicle||{};
   modelAddRef(state,{id:vehicle.id??report.vehicle_id,reg:b6Reg(report),slug:b6Slug(report)},{seen:true});
  }

}
async function loadModels(line=MODELS.selected,force=false){
 if(!MODEL_ROUTES[line])return;
 const state=modelState(line);
 if(state.loading||(!force&&state.source===(cfg.proxy||'')&&Date.now()-state.checkedAt<120000))return;
 state.loading=true;state.source=cfg.proxy||'';state.historyError=null;state.expectedError=null;state.progress='Finding today’s journeys…';
 const ticket=++state.ticket;
 // Keep this day's recorded models while refreshing, but never retain old arrival predictions.
 for(const [key,item] of state.refs){if(!item.seen)state.refs.delete(key);else{item.expected=false;item.upcoming=false;item.predicted=false;item.predictedAt=null}}
 modelRebuild(state);if(S.view==='models')renderModels();
 try{
  await modelService(state);
  const results=await Promise.allSettled([modelHistory(state,ticket),modelExpected(state)]);
  if(!modelCurrent(state,ticket))return;
  if(results[0].status==='rejected')state.historyError=results[0].reason?.kind||'unavailable';
  if(results[1].status==='rejected')state.expectedError=results[1].reason?.kind||'unavailable';
  const entries=[...state.refs.values()];let index=0,done=0;
  const worker=async()=>{while(index<entries.length){
   if(!modelCurrent(state,ticket))return;
   const item=entries[index++];item.vehicle=await modelVehicle(item.ref);done++;
   state.progress=`Checking bus models · ${done} of ${entries.length}`;modelRebuild(state);
   if(S.view==='models'&&MODELS.selected===line)renderModels();
  }};
  await Promise.all([worker(),worker(),worker()]);
  if(modelCurrent(state,ticket))await modelPredictedWorkings(state,ticket,force);
  if(modelCurrent(state,ticket)){modelRebuild(state);state.checkedAt=Date.now()}
 }catch(error){state.historyError=error?.kind||'unavailable';state.historyComplete=false;state.checkedAt=Date.now()}

MODELS.predictionCache=new Map();MODELS.blockCache=new Map();MODELS.tripCache=new Map();
function predictionDocument(html,date){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const selected=doc.querySelector('select[name="date"] option[selected]')||doc.querySelector('input[name="date"]');
 if(selected?.getAttribute('value')!==date)throw new ApiErr('format','Vehicle history date was not confirmed');

function parseModelPredictions(html,state,tripIds=null){
 const doc=predictionDocument(html,state.date),times=[];
 for(const row of doc.querySelectorAll('tr.prediction')){
  const cells=[...row.querySelectorAll('td')];
  if(cells.length<3||cells[0].textContent.trim()!==state.line)continue;
  const clock=cells[2].textContent.trim();if(/[⁺¹]|\+\s*1/.test(clock))continue;
  const time=/^(\d{1,2}:\d{2})(?::\d{2})?$/.exec(clock);if(!time)continue;
  if(tripIds){
   const href=cells[2].querySelector('a[href]')?.getAttribute('href')||'';
   const id=/^\/trips\/(\d+)\/?(?:[?#]|$)/.exec(href)?.[1];
   if(!id||!tripIds.has(String(id)))continue;
  }
  for(const when of wallTimeMs(time[1],londonCalendar(Date.parse(state.date+'T12:00:00Z')))||[]){
   if(when>Date.now()&&londonKey(londonCalendar(when))===state.date)times.push(when);
  }

async function predictionText(cache,key,path,date,force){

async function modelFutureTrips(state,force){
 const key=state.line+'/'+state.date,old=MODELS.tripCache.get(key);
 if(!force&&old&&old.until>Date.now())return old.trips;
 const trips=[],cursors=new Set();let cursor;
 for(let page=0;page<50;page++){
  const data=await api('bt','/api/trips/',{service:state.serviceId,date:state.date,...(cursor?{cursor}:{})});

  else if(h.t==='bus'&&S.chosen)sheet(`<h3>Bus ${esc(S.chosen.vehicleId)}</h3><p>${esc(S.chosen.currentLocation||'')}</p><p class="small mut">${S.bp?.gps?'Recent bustimes.org GPS position; may have moved.':'Position estimated from TfL’s next-stop prediction, not GPS.'}</p><button class="pri" data-go="bus">Bus details</button>`);
  else if(h.t==='stop0')showStopSheet(S.stop.id,S.stop.name,S.stop.letter);
  else if(h.t==='home')sheet(`<h3>Start</h3><p>${esc(S.startLabel)}</p>`);
  return}
 $('#sheet').classList.remove('on');
}
function initMap(){
 mapOn=true;startVectorMap();if(mInit){mapResize();return}
 const c=$('#mc');if(!c||!c.getContext){$('#mapmsg').hidden=false;return}
 mInit=true;mapResize();addEventListener('resize',mapResize);
 c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1)down={t:performance.now(),m:0};else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:V.z};down=null}});
 c.addEventListener('pointermove',e=>{const o=ptrs.get(e.pointerId);if(!o)return;const n=[e.clientX,e.clientY];ptrs.set(e.pointerId,n);
  if(ptrs.size===1){const dx=n[0]-o[0],dy=n[1]-o[1];if(down)down.m+=Math.abs(dx)+Math.abs(dy);if(down&&down.m>8&&camFollow){camFollow=false;$('#mFollow').setAttribute('aria-pressed','false')}panBy(dx,dy)}
  else if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];V.z=clamp(pinch.z+Math.log2(Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d),2,19);VT=null;want()}});
 const up=e=>{const was=down;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(was&&was.m<8&&performance.now()-was.t<600&&ptrs.size===0){const r=c.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)}if(ptrs.size===0)down=null};
 c.addEventListener('pointerup',up);c.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);down=null;pinch=null});
 c.addEventListener('wheel',e=>{e.preventDefault();zoomBy(-e.deltaY*.0025)},{passive:false});
 c.addEventListener('dblclick',()=>zoomBy(1));
 updateMap(true);
}
function fitView(){
 if(!M.sp||!W)return;const pts=[M.sp];if(S.start)pts.push(S.start);if(S.bp)pts.push(S.bp.pos);
 const lo=Math.min(...pts.map(p=>p[0])),hi=Math.max(...pts.map(p=>p[0])),a=Math.min(...pts.map(p=>p[1])),b=Math.max(...pts.map(p=>p[1]));
 let z=17;while(z>3&&(Math.abs(wx(hi,z)-wx(lo,z))>W-110||Math.abs(wy(a,z)-wy(b,z))>H-320))z-=.25;
 VT={f:{...V},t:{lon:(lo+hi)/2,lat:(a+b)/2,z},t0:performance.now(),d:reduced()?1:700};want();
}
function sliceLine(line,a,b){const n=p=>{let bi=0,bd=1e9;line.forEach((v,i)=>{const d=hav(v,p);if(d<bd){bd=d;bi=i}});return bi};const i=n(a),j=n(b);return i<=j?line.slice(i,j+1):line.slice(j,i+1).reverse()}
function updateMap(fit){
 if(!S.stop||S.stop.id==='demo')return;
 const sp=[S.stop.lon,S.stop.lat];M.sp=sp;M.route=S.seq?S.seq.line:null;M.walk=showWalk&&S.walk?S.walk.geom:null;
 M.prog=S.bp&&S.seq?sliceLine(S.seq.line,S.bp.pos,sp):null;
 const pts=new Map();S.nearby.forEach(s=>pts.set(s.id,s));(S.seq?S.seq.stops:[]).forEach(s=>{if(!pts.has(s.id))pts.set(s.id,{id:s.id,name:s.name,letter:'',lon:s.lon,lat:s.lat})});
 pts.delete(S.stop.id);M.stops=[...pts.values()];
 if(S.bp){if(!cur||reduced())cur=S.bp.pos.slice();else anim={f:cur,t:S.bp.pos,t0:performance.now()}}else cur=null;
 if(fit&&mapOn)fitView();want();
}
function sheet(h){const s=$('#sheet');s.innerHTML=h+'<button class="ghost" id="shClose" style="margin-top:8px">Close</button>';s.classList.add('on')}
function mapSheetRefresh(){}
async function showStopSheet(id,name,letter){
 sheet(`<h3>${esc(name)}${letter?' · Stop '+esc(letter):''}</h3><p class="mut">Loading arrivals…</p>`);
 try{const result=await arrivalsForStop(id);const a=result.arr.slice(0,4);
  const s=S.nearby.find(x=>x.id===id);
  sheet(`<h3>${esc(name)}${letter?' · Stop '+esc(letter):''}</h3>${a.length?a.map(x=>`<div class="kv"><div class="k">${esc(x.vehicleId||'Route 91')}</div><div class="v">${fmtT(Date.parse(x.expectedArrival))} · ${Math.round((Date.parse(x.expectedArrival)-Date.now())/60000)} min ${x.predictionKind==='scheduled'?'(scheduled)':''}</div></div>`).join(''):'<p>No Route 91 buses predicted here.</p>'}${s?`<button class="pri" data-usestop="${esc(id)}" style="margin-top:8px">Use this stop</button>`:''}`)}
 catch{sheet(`<h3>${esc(name)}</h3><p>Arrivals unavailable right now.</p>`)}
}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-go],[data-pick],[data-geo],[data-b6-id],[data-model-route]');if(!t)return;
 if(t.dataset.modelRoute){MODELS.selected=t.dataset.modelRoute;renderModels();loadModels();return}
 if(t.id==='modelsRefresh'){loadModels(MODELS.selected,true);return}
 if(t.dataset.go){if(t.dataset.go==='models'&&S.view==='bristol6')MODELS.selected='6';go(t.dataset.go);return}
 if(t.dataset.b6Id){await chooseBristol6(t.dataset.b6Id);return}
 if(t.id==='busCard'){go('map',true);return}
 if(t.dataset.pick!=null){await choose(S.cands[+t.dataset.pick]);return}
 if(t.dataset.geo){const g=S.geoAlt[+t.dataset.geo];S.start=[g.lon,g.lat];S.startLabel=g.label;S.geoAlt=[g,...S.geoAlt.filter(x=>x!==g)];await resolveStop();render();return}
 if(t.dataset.follow){cfg.followVid=cfg.followVid===t.dataset.follow?null:t.dataset.follow;persist();render();refresh();return}
 if(t.dataset.usestop){const s=S.nearby.find(x=>x.id===t.dataset.usestop);if(s){await choose(s);$('#sheet').classList.remove('on');toast('Now tracking '+s.name)}return}
 switch(t.id){
  case 'btnRefresh':case 'bRefresh':if(S.view==='models'){await loadModels(MODELS.selected,true)}else if(S.view==='bristol6'){B6.loadedAt=0;await loadBristol6(true)}else{toast('Refreshing…');S.weatherAt=0;S.roadsAt=0;await refresh()}break;
  case 'b6Refresh':B6.loadedAt=0;await loadBristol6(true);break;
  case 'b6Back':B6.selected=null;B6.details=null;B6.journey=null;renderBristol6();break;
  case 'retryBoot':S.bootErr=null;S.err=null;boot();break;
  case 'btnSettings':go('settings');break;
  case 'demoOn':S.demo=true;S.err=null;if(!S.stop){S.stop={id:'demo',name:'Bus Stop A (DEMO)',letter:'A',lat:0,lon:0,lines:['91']};S.walk={dist:320,geom:[[0,0],[0,0]],src:'Demo value',live:false}}refresh();break;
  case 'demoOff':S.demo=false;S.arr=[];S.fetchedAt=0;if(S.stop?.id==='demo'){S.stop=null;S.walk=null;boot()}else refresh();break;
  case 'chgStop':case 'bStop':go('pick');break;
  case 'followBtn':cfg.followVid=cfg.followVid===S.chosen?.vehicleId?null:S.chosen?.vehicleId;persist();render();break;
  case 'mBack':go('overview');break;
  case 'mDetails':go('bus');break;
  case 'mRecenter':updateMap(true);break;
  case 'mZin':zoomBy(1);break;
  case 'mZout':zoomBy(-1);break;
  case 'mFollow':camFollow=!camFollow;t.setAttribute('aria-pressed',camFollow);if(camFollow&&S.chosen){cfg.followVid=S.chosen.vehicleId;persist()}updateMap();break;
  case 'mWalk':showWalk=!showWalk;t.setAttribute('aria-pressed',showWalk);updateMap();break;
  case 'mTraffic':cfg.traffic=!cfg.traffic;t.setAttribute('aria-pressed',cfg.traffic);persist();updateMap();break;
  case 'mTiming':cfg.timing=!cfg.timing;t.setAttribute('aria-pressed',String(cfg.timing));persist();if(cfg.timing&&S.veh?.id)loadBtJourneyInfo(S.veh,S.arrSource==='bt').then(()=>{render();updateMap()});updateMap();toast(cfg.timing?'Showing available published timing points':'Timing points hidden');break;
  case 'shClose':$('#sheet').classList.remove('on');break;
  case 'bLook':{const a=$('#sAddr').value.trim();if(!a)break;cfg.address=a;cfg.startCoords=null;cfg.stopId=null;persist();toast('Looking up…');try{await resolveStart();await resolveStop();toast('Start confirmed');render()}catch{toast('Address not found')}break}
  case 'bClearAddr':cfg.address=DEF_ADDR;cfg.startCoords=null;cfg.stopId=HOME_STOP;persist();toast('Restored your home address');renderSettings();break;
  case 'bDelete':try{localStorage.removeItem('b91')}catch{}cfg={...DEF};S.notified={};toast('Saved journey deleted');applyTheme();renderSettings();break;
  case 'bProxy':cfg.proxy=$('#sProxy').value.trim();persist();toast('Saved. Refreshing…');if(!S.stop)boot();else refresh();break;
  case 'bCopy':try{await navigator.clipboard.writeText(WORKER);toast('Worker code copied')}catch{toast('Select and copy the code below')}break;
 }
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='sWalk'){cfg.walkKmh=+t.value;$('#vWalk').textContent=fmtS(cfg.walkKmh);persist();if(S.walk)render()}
 if(t.id==='sBuf'){cfg.buffer=+t.value;$('#vBuf').textContent=cfg.buffer+' min';persist()}
});
document.addEventListener('change',async e=>{const t=e.target;const m={cLeave:'leaveNow',cTraffic:'traffic',cTiming:'timing',cMo:'motion',cWx:'weather',cSave:'saveAddress'};
 if(m[t.id]){cfg[m[t.id]]=t.checked;if(t.id==='cSave'&&t.checked){cfg.address=cfg.address||S.startLabel&&DEF_ADDR;cfg.startCoords=S.start;cfg.stopId=S.stop?.id||null}persist();applyTheme();if(t.id==='cWx'){S.weatherAt=0;loadWeather().then(render)}if(t.id==='cTraffic')refresh();return}
 if(t.id==='cNotify'){cfg.notify=t.checked;if(t.checked&&'Notification'in window){try{const p=await Notification.requestPermission();if(p!=='granted')toast('Notifications blocked. You will get an in-app alert while the app is open.')}catch{}}persist();return}
 if(t.id==='cLoc'){cfg.useLoc=t.checked;persist();if(t.checked){try{await resolveStart();await resolveStop();render()}catch{toast('Location unavailable')}}return}
 if(t.id==='sKnownWalk'){cfg.walkMinutes=Number(t.value);persist();render();return}
 if(t.id==='sUnits'||t.id==='sTheme'){cfg[t.id==='sUnits'?'units':'theme']=t.value;persist();applyTheme();render()}
});
/* ---------- theme, clock, PWA ---------- */
function applyTheme(){want();const d=cfg.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):cfg.theme;document.documentElement.dataset.theme=d;syncVectorStyle();document.documentElement.dataset.motion=reduced()?'reduced':'';$('meta[name=theme-color]').content=d==='dark'?'#111214':'#f3f4f5'}
function tick(){$('#clock').textContent=fmtTS(Date.now());if(S.stop&&S.view==='overview'){const P=calc();if(P||S.chosen===null)renderHero(P)}}
function pwa(){
 // Files need to be served over HTTPS (or localhost), not opened from file://.
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

async function boot(){
 S.loading=true;render();
 try{await resolveStart();await resolveStop()}
 catch(e){S.loading=false;S.err=e.kind||'err';S.bootErr=(S.step||'start-up')+': '+(e.kind==='http'?'server replied HTTP '+e.message:e.kind==='net'||e instanceof TypeError?'request blocked or no connection (CORS, offline, or the file was opened locally)':e.message||String(e));logE('boot failed '+S.bootErr);toast(e.kind==='nf'?'Address not found. Check Settings.':'Could not reach lookup services.')}
 S.loading=false;render();
}
applyTheme();pwa();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);
addEventListener('online',()=>{if(S.view==='models')loadModels();else if(S.view==='bristol6')loadBristol6(true);else refresh()});addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.view==='models')loadModels();else if(S.view==='bristol6')loadBristol6(true);else refresh()}});
setInterval(tick,1000);setInterval(()=>{if(S.view==='models')loadModels();else if(S.view==='bristol6')loadBristol6(true);else refresh()},20000);tick();
boot();
})();
